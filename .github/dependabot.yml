# Dependabot — keeps GitHub Actions and Gradle dependencies up to date.
# Default grouping: one PR per dependency update.
version: 2
updates:
  # Actions used in .github/workflows/*
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Gradle dependencies and the version catalog (gradle/libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
