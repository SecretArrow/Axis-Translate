# E2E — instrumented tests on an emulator.
#
# Runs automatically when the "CI" workflow completes successfully on main
# (workflow_run chaining), or manually via workflow_dispatch.
name: "E2E"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Only run after a successful CI run (manual dispatch always allowed).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache emulator system image
        uses: actions/cache@v4
        with:
          path: ${ANDROID_HOME}/system-images/android-30/google_apis/x86_64
          key: emulator-30-google-apis-x86_64-v1

      # x86_64-only native build (-Paxis.abis=x86_64) keeps the emulator run
      # fast; the API 30 x86_64 image boots with KVM acceleration.
      - name: Instrumented tests on emulator (API 30, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot"
          disable-animations: true
          script: |
            adb shell settings put global window_animation_scale 0 || true
            cd android && ./gradlew connectedDebugAndroidTest -Paxis.abis=x86_64 -Paxis.buildNumber=${{ github.run_number }} --stacktrace

      - name: Upload instrumented test results (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-reports
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/**
