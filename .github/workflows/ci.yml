# CI — quality gate for Axis Translate (Android + Desktop).
#
# Chain: CI (this file) -> E2E (workflow_run) -> Release (workflow_run).
# Runs on: push to main, version tags, PRs to main, manual dispatch.
#
# Auto-fix: on push events to main, ktlintFormat is run first; if it produces
# changes they are committed as "style: ktlint auto-fix [auto-fix]" and pushed,
# and this run ends early (green). A fresh CI run then validates the fix.
name: "CI"

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# contents: write -> auto-fix commit/push to main.
# actions: write -> dispatch the fresh validating run after the auto-fix push
#           (pushes made with GITHUB_TOKEN do not trigger workflows themselves).
permissions:
  contents: write
  actions: write

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Android: ktlint auto-fix, then quality checks + debug build
  # ==========================================================================
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # ktlint auto-fix — push events to main only.
      #   1. run ktlintFormat (failures tolerated, format is best-effort)
      #   2. if anything changed -> commit + push "style: ktlint auto-fix [auto-fix]"
      #      and dispatch a fresh CI run to validate it
      # Loop guards (this can never loop):
      #   - this step only runs for event_name == 'push' on refs/heads/main, and
      #     the dispatched fresh run is a workflow_dispatch event, so it never
      #     re-enters this step;
      #   - the head_commit message must not already contain [auto-fix];
      #   - ktlintFormat is idempotent, so the fresh run finds nothing to fix.
      - name: ktlint auto-fix (commit style fixes to main)
        id: ktlint_autofix
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[auto-fix]') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew ktlintFormat --continue -Paxis.buildNumber=${{ github.run_number }} || true
          git config user.name "axis-ci-bot"
          git config user.email "ci@axis-translate.local"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "style: ktlint auto-fix [auto-fix]"
            git push
            # A push made with GITHUB_TOKEN does not itself trigger a new
            # workflow run, so dispatch the validating run explicitly
            # (workflow_dispatch is the one event GITHUB_TOKEN may trigger).
            gh workflow run ci.yml --ref main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # If the auto-fix pushed, this run ends here (green) — the fresh run
      # triggered above performs the full validation. Otherwise: full checks.
      - name: ktlintCheck, Android Lint, unit tests, debug build
        if: ${{ steps.ktlint_autofix.outputs.pushed != 'true' }}
        run: >-
          ./gradlew ktlintCheck lintDebug testDebugUnitTest assembleDebug
          assembleDebugAndroidTest
          -Paxis.buildNumber=${{ github.run_number }} --stacktrace

      - name: Upload debug APK
        if: ${{ steps.ktlint_autofix.outputs.pushed != 'true' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload test/lint reports (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-reports
          path: android/app/build/reports/**

  # ==========================================================================
  # Desktop: C11 app — build + unit tests on Ubuntu and Windows
  # ==========================================================================
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache desktop build (llama.cpp + SDL2 sources/objects)
        uses: actions/cache@v6
        with:
          path: desktop/build
          key: desktop-build-${{ runner.os }}-${{ hashFiles('desktop/CMakeLists.txt', 'desktop/src/*.c') }}
          restore-keys: |
            desktop-build-${{ runner.os }}-

      # ktlint auto-fix ended this run early — skip everything else too.
      - name: Short-circuit when the auto-fix step pushed
        id: shortcircuit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[auto-fix]') }}
        run: echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies (SDL2 + libcurl)
        if: ${{ runner.os == 'Linux' && steps.shortcircuit.outputs.skip != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev

      - name: Configure (CMake)
        if: ${{ steps.shortcircuit.outputs.skip != 'true' }}
        run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: ${{ steps.shortcircuit.outputs.skip != 'true' }}
        run: cmake --build desktop/build --config Release --parallel

      - name: Unit tests (CTest)
        if: ${{ steps.shortcircuit.outputs.skip != 'true' }}
        run: ctest --test-dir desktop/build --build-config Release --output-on-failure

      - name: Headless smoke run (Linux)
        if: ${{ runner.os == 'Linux' && steps.shortcircuit.outputs.skip != 'true' }}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: timeout 60 ./desktop/build/axis-translate --smoke

      - name: Version smoke run (Windows)
        if: ${{ runner.os == 'Windows' && steps.shortcircuit.outputs.skip != 'true' }}
        run: ./desktop/build/Release/axis-translate.exe --version
        shell: pwsh

      - name: Upload binary artifact
        if: ${{ steps.shortcircuit.outputs.skip != 'true' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-${{ runner.os }}
          path: |
            desktop/build/axis-translate
            desktop/build/Release/axis-translate.exe
          if-no-files-found: ignore
